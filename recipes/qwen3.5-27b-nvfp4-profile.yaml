# Recipe: Qwen3.5-27B-NVFP4 (Sehyo) — Profiling configuration
# Smaller model for fast iteration on kernel optimizations

recipe_version: "1"
name: Qwen3.5-27B-NVFP4-Profile
description: vLLM serving Sehyo/Qwen3.5-27B-NVFP4 with torch profiler

model: Sehyo/Qwen3.5-27B-NVFP4

container: vllm-node

mods:
  - mods/fix-qwen3.5-rope-validate
  - mods/fix-autotune-sm-threshold

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 131072
  max_num_batched_tokens: 8192

env:
  VLLM_NVFP4_GEMM_BACKEND: "cutlass"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

command: |
  vllm serve Sehyo/Qwen3.5-27B-NVFP4 \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    -tp {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --profiler-config.profiler=torch \
    --profiler-config.torch_profiler_dir=/tmp/vllm_profile \
    --profiler-config.torch_profiler_with_stack=true \
    --profiler-config.torch_profiler_record_shapes=true \
    --profiler-config.delay_iterations=10 \
    --profiler-config.max_iterations=30 \
    --profiler-config.ignore_frontend=true
