recipe_version: "1"
name: Qwen3.5-27B-AllFP4-Simulated
description: All-FP4 baseline (uniform NVFP4 round-trip, stored as bf16)

model: local

container: vllm-node

mods:
  - mods/fix-qwen3.5-rope-validate
  - mods/fix-autotune-sm-threshold

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  max_num_batched_tokens: 8192

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

command: |
  vllm serve /models/Qwen3.5-27B-allfp4-simulated \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    -tp {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer
