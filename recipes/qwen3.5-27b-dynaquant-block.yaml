recipe_version: "1"
name: Qwen3.5-27B-DynaQuant-Block
description: |
  DynaQuant block-level mixed-precision (HAWQ + water-filling).
  11 blocks FP4 (NVFP4 W4A4), 54 blocks FP8-in-BF16 storage.
  Knee of block-level Pareto curve. Avg 7.3 effective bits.
  FP4 blocks: 22,23,37,38,39,41,42,44,45,49,53.
  Exported via AutoRound iters=0 (RTN) + NVFP4 packing.

model: local

container: vllm-node

mods:
  - mods/fix-qwen3.5-rope-validate
  - mods/fix-autotune-sm-threshold

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 32768
  max_num_batched_tokens: 8192

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

command: |
  vllm serve /tmp/dynaquant-27b-ct \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    -tp {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer
