recipe_version: "1"
name: Qwen3.5-27B-Sehyo-Test
description: Test Sehyo original model on new container

model: Sehyo/Qwen3.5-27B-NVFP4
container: vllm-node-tf5

mods:
  - mods/fix-qwen3.5-rope-validate

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 4096
  max_num_batched_tokens: 4096

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

command: |
  vllm serve Sehyo/Qwen3.5-27B-NVFP4 \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --trust-remote-code \
    -tp {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --enforce-eager
